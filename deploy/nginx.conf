# banyu-web 静态包 nginx 配置
# 域名 ban-yu.xyz，HTTPS 证书由 certbot（nginx 插件）自动签发和续期，无需手动操作
# 手动更新本配置后：nginx -t && nginx -s reload
# 用法：
#   1. npm run build:static        # 产出 out/
#   2. 把 out/ 上传到服务器，例如 /var/www/banyu-web
#   3. 本文件放 /etc/nginx/conf.d/banyu.conf

# HTTP 一律跳 HTTPS；直接用 IP 访问的归一到主域名
server {
    listen 80;
    server_name ban-yu.xyz www.ban-yu.xyz;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name _;

    location / {
        return 301 https://ban-yu.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ban-yu.xyz www.ban-yu.xyz;

    ssl_certificate /etc/letsencrypt/live/ban-yu.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ban-yu.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/banyu-web;          # 指向 out/ 目录
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API 反代到 Docker 里的独立后端（compose 里端口已映射到宿主机回环）
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        # 浏览器直连场景：用真实客户端 IP 覆盖，防止伪造 XFF 绕过后端限频
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 兼容早期动态路由时期的分享链接 /mood/m_xxx
    location ~ ^/mood/(m_[A-Za-z0-9_-]+)$ {
        return 302 /mood/v?c=$1;
    }

    # 带哈希的静态资源长缓存
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /dolls/ 图片会原地更新（文件名不变），要求浏览器每次带 ETag 校验（命中则 304），避免换图后仍看到旧缓存
    location /dolls/ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
