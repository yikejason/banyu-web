# banyu-web 静态包 nginx 配置
# 用法：
#   1. npm run build:static        # 产出 out/
#   2. 把 out/ 上传到服务器，例如 /var/www/banyu-web
#   3. 本文件放 /etc/nginx/conf.d/banyu.conf（root 改成实际路径）
#   4. nginx -t && nginx -s reload
#   5. 有域名后：certbot --nginx -d 你的域名   # 自动补 443 和证书

server {
    listen 80;
    server_name 你的域名.com;          # 没域名先填服务器 IP

    root /var/www/banyu-web;          # 指向 out/ 目录
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API 反代到 Docker 里的独立后端（compose 里端口已映射到宿主机回环）
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        # 浏览器直连场景：用真实客户端 IP 覆盖，防止伪造 XFF 绕过后端限频
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 兼容早期动态路由时期的分享链接 /mood/m_xxx
    location ~ ^/mood/(m_[A-Za-z0-9_-]+)$ {
        return 302 /mood/v?c=$1;
    }

    # 带哈希的静态资源长缓存
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
