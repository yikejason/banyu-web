# banyu-web 静态包 nginx 配置
# 域名 ban-yu.xyz，HTTPS 证书由 certbot（nginx 插件）自动签发和续期，无需手动操作
# 手动更新本配置后：nginx -t && nginx -s reload
# 用法：
#   1. npm run build:static        # 产出 out/
#   2. 把 out/ 上传到服务器，例如 /var/www/banyu-web
#   3. 本文件放 /etc/nginx/conf.d/banyu.conf

# HTTP 一律跳 HTTPS；直接用 IP 访问的归一到主域名
server {
    listen 80;
    server_name ban-yu.xyz www.ban-yu.xyz;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name _;

    location / {
        return 301 https://ban-yu.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ban-yu.xyz www.ban-yu.xyz;

    ssl_certificate /etc/letsencrypt/live/ban-yu.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ban-yu.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/banyu-web;          # 指向 out/ 目录
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API 反代到 Docker 里的独立后端（compose 里端口已映射到宿主机回环）
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        # 浏览器直连场景：用真实客户端 IP 覆盖，防止伪造 XFF 绕过后端限频
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 兼容早期动态路由时期的分享链接 /mood/m_xxx
    location ~ ^/mood/(m_[A-Za-z0-9_-]+)$ {
        return 302 /mood/v?c=$1;
    }

    # RSC 预取文件扁平名 → 目录名：Next 16 静态导出按目录形式落盘
    # （journal/__next.journal/__PAGE__.txt），但路由器请求的是扁平形式
    # （/journal/__next.journal.__PAGE__.txt）。若服务器上残留旧构建的扁平同名文件，
    # 预取会拿到旧路由数据 → 加载旧 chunk → 渲染出旧页面（换新版本后仍见旧按钮的根因）。
    # 这里一律重写到目录形式，既修 404，也让任何残留的旧扁平文件永远无法生效。
    location ~ ^/(.+)/__next\.(.+)\.__PAGE__\.txt$ {
        rewrite ^/(.+)/__next\.(.+)\.__PAGE__\.txt$ /$1/__next.$2/__PAGE__.txt last;
    }

    # 带哈希的静态资源长缓存
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /dolls/ 图片会原地更新（文件名不变），要求浏览器每次带 ETag 校验（命中则 304），避免换图后仍看到旧缓存
    location /dolls/ {
        add_header Cache-Control "no-cache";
    }

    # HTML 与 version.json 走这里。
    # Clear-Site-Data "cache"：只清浏览器 HTTP 缓存，不动 localStorage（日记数据安全）。
    # 为什么需要：部分手机浏览器无视上面的 no-store，把旧 HTML/旧 JS 存进磁盘缓存，
    # 之后每次「重新打开 App」都先用旧缓存，造成一进入就是旧按钮、手动刷新才变新。
    # 旧页面自己每 8~60s 会拉一次 version.json（也走本 location），响应一送达就把
    # 整站 HTTP 缓存洗掉，用户下次打开自然拿到新页面，无需任何手动操作。
    # 副作用：缓存常清、跨打开的 JS chunk 少复用，个人规模站点可接受。
    location / {
        try_files $uri.html $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Clear-Site-Data '"cache"' always;
        expires -1;
    }
}
